[package]
name = "ostra-swap-circuit"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The Ostra Swap spend circuit: a Plonky3 STARK over KoalaBear, hash-only and zero-knowledge."

[dependencies]
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-keccak = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-poseidon2 = "=0.8.0"
p3-poseidon2-air = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
rand = { version = "=0.10.1", default-features = false, features = ["std_rng"] }
serde_json = "=1.0.149"

[[bin]]
name = "ostra-prove"
path = "src/bin/ostra-prove.rs"

[dev-dependencies]
p3-symmetric = "=0.8.0"
p3-air = "=0.8.0"
p3-matrix = "=0.8.0"
p3-field = "=0.8.0"
